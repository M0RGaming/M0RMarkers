name: PushToEsoUI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'     
        required: true
        default: '2.2.1'

jobs:
  hello_world_job:
    runs-on: ubuntu-latest
    name: Pushing
    steps:
      - uses: actions/checkout@v2
        with:
          path: 'M0RMarkers'

      - uses: actions/checkout@v7
        with:
          repository: 'Kyzderp/AntiClankerAddonConsortiumUpdateChecker'
          token: ${{ secrets.ACAC_PAT }}
          path: 'M0RMarkers/PC/ACAC'

      - name: Zip release
        run: 7z a M0RMarkers.zip * -xr!*.git* -x!M0RMarkers/PC/ACAC/README.md

      - name: Push to EsoUI
        id: push
        uses: M0RGaming/Push-To-EsoUI@main
        with:
          EsoUIToken: ${{secrets.ESOUI_API_TOKEN}}
          EsoUIID: 4266
          path: './M0RMarkers/'
          version: ${{github.event.inputs.version}}
          artifact: 'M0RMarkers.zip'