name: CreateRelease

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  hello_world_job:
    runs-on: ubuntu-latest
    name: Pushing
    steps:
      - uses: actions/checkout@v2
        with:
          path: 'M0RMarkers'

      - uses: actions/checkout@v2
        with:
          repository: 'Kyzderp/AntiClankerAddonConsortiumUpdateChecker'
          path: 'M0RMarkers/PC/ACAC'

      - name: List Files in ACAC
        run: ls M0RMarkers/PC/ACAC

      - name: Zip release
        run: 7z a M0RMarkers.zip * -xr!*.git*

      - name: Generate Changelog Diff
        run: |
          awk '/^----- / { if (!found) { found=1; print; next } else { exit } } found' M0RMarkers/changelog.txt > RELEASE_NOTES.txt
          cat RELEASE_NOTES.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: M0RMarkers.zip
          body_path: RELEASE_NOTES.txt
          token: ${{ secrets.TOKEN_GITHUB }}